name: Ruby UWP Launcher (x64)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'uwp/**'
      - '.github/workflows/uwp-ruby-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Generate placeholder UWP assets
        shell: pwsh
        run: |
          $assets = "uwp/Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $pngB64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          $bytes = [Convert]::FromBase64String($pngB64)
          foreach ($name in @(
            "StoreLogo.png",
            "Square44x44Logo.png",
            "Square71x71Logo.png",
            "Square150x150Logo.png",
            "Wide310x150Logo.png",
            "SplashScreen.png"
          )) {
            [IO.File]::WriteAllBytes((Join-Path $assets $name), $bytes)
          }

      - name: Configure CMake (x64 only)
        working-directory: uwp
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build RubyLauncher (x64 Release)
        working-directory: uwp
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Locate output and verify 64-bit PE
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path uwp/build -Recurse -Filter RubyLauncher.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "No RubyLauncher.exe found"
            Get-ChildItem -Path uwp/build -Recurse | Select-Object -First 80 FullName
            exit 1
          }
          Write-Host "Found $($exe.FullName)"

          # PE machine type at offset after e_lfanew: IMAGE_FILE_MACHINE_AMD64 = 0x8664
          $fs = [IO.File]::OpenRead($exe.FullName)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $peOffset = $br.ReadInt32()
          $fs.Seek($peOffset, 'Begin') | Out-Null
          $peSig = $br.ReadUInt32()  # PE\0\0
          $machine = $br.ReadUInt16()
          $br.Close()
          $fs.Close()

          $machineHex = '0x{0:X4}' -f $machine
          Write-Host "PE signature OK=$($peSig -eq 0x4550) machine=$machineHex"
          if ($machine -ne 0x8664) {
            Write-Error "RubyLauncher.exe is NOT 64-bit (machine=$machineHex, expected 0x8664 AMD64)"
            exit 1
          }
          Write-Host "Verified: 64-bit (x64 / AMD64)"

          echo "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "exedir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Stage package layout
        shell: pwsh
        run: |
          $stage = "uwp/package-stage"
          New-Item -ItemType Directory -Force -Path "$stage/Assets" | Out-Null
          Copy-Item "$env:EXE" "$stage/RubyLauncher.exe"
          Copy-Item uwp/Assets/*.png $stage/Assets/
          $manifest = Get-Content uwp/Package.appxmanifest -Raw
          $manifest = $manifest -replace '\$targetnametoken\$\.exe', 'RubyLauncher.exe'
          $manifest = $manifest -replace 'EntryPoint="RubySapphireRecomp.App"', 'EntryPoint="Windows.FullTrustApplication"'
          Set-Content -Path "$stage/AppxManifest.xml" -Value $manifest -Encoding UTF8
        env:
          EXE: ${{ steps.out.outputs.exe }}

      - name: Create MSIX with MakeAppx (best-effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter MakeAppx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { Write-Warning "MakeAppx not found"; exit 0 }
          & $makeAppx.FullName pack /d uwp/package-stage /p uwp/RubyLauncher-x64.msix /o
          if ($LASTEXITCODE -ne 0) { Write-Warning "MakeAppx failed"; exit 0 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RubyLauncher-x64
          path: |
            uwp/build/**/RubyLauncher.exe
            uwp/build/**/RubyLauncher.pdb
            uwp/RubyLauncher-x64.msix
            uwp/package-stage/**
          if-no-files-found: warn
