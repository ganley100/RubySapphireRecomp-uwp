name: Ruby Launcher MSIX (x64 UWP)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'uwp/**'
      - '.github/workflows/uwp-ruby-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate UWP icons from Ruby box art
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pillow
          New-Item -ItemType Directory -Force -Path uwp/Assets | Out-Null
          if (Test-Path uwp/generate_uwp_assets.py) {
            python uwp/generate_uwp_assets.py uwp/Assets
          }
          # Fallback tiny red tile if generator failed
          $need = @(
            'StoreLogo.png','Square44x44Logo.png','Square71x71Logo.png',
            'Square150x150Logo.png','Wide310x150Logo.png','SplashScreen.png'
          )
          foreach ($n in $need) {
            $p = Join-Path 'uwp/Assets' $n
            if (-not (Test-Path $p) -or ((Get-Item $p).Length -lt 100)) {
              Write-Warning "Missing $n — writing fallback"
              python -c "from PIL import Image; Image.new('RGB',(150,150),(196,30,58)).save(r'uwp/Assets/$n')"
            }
          }
          Get-ChildItem uwp/Assets | Format-Table Name, Length

      - name: Configure CMake (WindowsStore x64 UWP)
        working-directory: uwp
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_SYSTEM_NAME=WindowsStore ^
            -DCMAKE_SYSTEM_VERSION=10.0

      - name: Build RubyLauncher (x64 Release)
        working-directory: uwp
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Verify 64-bit PE
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path uwp/build -Recurse -Filter RubyLauncher.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "RubyLauncher.exe not found" }
          $fs = [IO.File]::OpenRead($exe.FullName)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $peOffset = $br.ReadInt32()
          $fs.Seek($peOffset + 4, 'Begin') | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($machine -ne 0x8664) { throw "Not x64" }
          Write-Host "OK x64: $($exe.FullName)"
          echo "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "uwp/package-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage/Assets" | Out-Null
          Copy-Item "$env:EXE" "$stage/RubyLauncher.exe"
          Copy-Item uwp/Assets/*.png "$stage/Assets/"
          $xml = Get-Content uwp/Package.appxmanifest -Raw
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [IO.File]::WriteAllText("$stage/AppxManifest.xml", $xml, $utf8NoBom)
        env:
          EXE: ${{ steps.out.outputs.exe }}

      - name: MakeAppx -> MSIX
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter MakeAppx.exe |
            Where-Object { $_.FullName -match '\\x64\\MakeAppx.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw "MakeAppx.exe not found" }
          & $makeAppx.FullName pack /d uwp\package-stage /p uwp\RubyLauncher-x64.msix /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed" }

      - name: Sign MSIX
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=RubyLauncherDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "RubyLauncher Dev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "password" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath uwp\RubyLauncherDev.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath uwp\RubyLauncherDev.cer | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /a /f uwp\RubyLauncherDev.pfx /p password uwp\RubyLauncher-x64.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

      - name: Upload MSIX + cert
        uses: actions/upload-artifact@v4
        with:
          name: RubyLauncher-x64-msix
          path: |
            uwp/RubyLauncher-x64.msix
            uwp/RubyLauncherDev.cer
            uwp/Assets/*.png
            uwp/build/**/RubyLauncher.exe
          if-no-files-found: error
